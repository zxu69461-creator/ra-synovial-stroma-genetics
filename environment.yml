# Main analysis environment (versions as used for the manuscript)
name: ra-rx
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy=2.4
  - pandas=2.3
  - scipy=1.17
  - statsmodels=0.15
  - scikit-learn=1.9
  - scanpy=1.11.5
  - anndata=0.12
  - scvi-tools=1.4.2
  - python-igraph
  - leidenalg=0.12
  - h5py=3.16
  - duckdb=1.5
  - python-duckdb=1.5
  - pyarrow=25
  - matplotlib=3.10
  - seaborn=0.13
  - openpyxl=3.1
  - requests
  - networkx
  - salmon=1.11.4
  - aria2
  - sra-tools
  - pip
  - pip:
      - scdrs==1.0.2
      - pyliftover==0.4.1
